version: "1.0"\nseverity:\n  blocking: "Output must stop."\n  major: "Output must be revised before packaging."\n  minor: "Warning; output may continue."\n\nrules:\n  - code: INPUT_REQUIRED_FIELDS
    stage: input
    severity: blocking
    condition: "All canonical input groups and required fields exist."
    route: input

  - code: INPUT_DURATION_VALID
    stage: input
    severity: blocking
    condition: "Duration is greater than zero and expressed in seconds."
    route: input

  - code: INPUT_SCENE_COUNT_VALID
    stage: input
    severity: blocking
    condition: "Scene count is auto or a positive integer."
    route: input

  - code: STRATEGY_OBJECTIVE_ALIGNED
    stage: strategy
    severity: major
    condition: "Primary message and audience action are compatible with campaign objective and stage."
    route: strategy

  - code: FORMAT_ANGLE_COMPATIBLE
    stage: format
    severity: major
    condition: "Selected format can naturally express the selected angle."
    route: format

  - code: SILENT_FORMAT_HAS_BEHAVIOR
    stage: script_behavior
    severity: blocking
    condition: "Silent formats contain behavioral scripting and do not depend on dialogue."
    route: script_behavior

  - code: TALKING_FORMAT_HAS_DIALOGUE
    stage: script_behavior
    severity: blocking
    condition: "Talking formats contain usable dialogue beats."
    route: script_behavior

  - code: DIALOGUE_DURATION_FEASIBLE
    stage: script_behavior
    severity: major
    condition: "Dialogue volume fits the available duration with natural pauses and reactions."
    route: script_behavior

  - code: ONE_MEANINGFUL_ACTION_PER_BEAT
    stage: script_behavior
    severity: major
    condition: "Each beat contains a manageable primary action or state change."
    route: script_behavior

  - code: TIMELINE_CONTINUOUS
    stage: storyboard
    severity: blocking
    condition: "Scene and beat timing does not overlap, reverse, or exceed total duration."
    route: storyboard

  - code: SCENE_COUNT_MATCHES_PLAN
    stage: storyboard
    severity: major
    condition: "Resolved scene count matches the strategy unless an explicit engine decision explains the change."
    route: storyboard

  - code: FRAME_TRANSITION_PLAUSIBLE
    stage: storyboard
    severity: major
    condition: "Every Frame A to Frame B transition can occur through continuous physical motion."
    route: storyboard

  - code: IMAGE_PROMPT_HAS_IDENTITY_LOCK
    stage: image_prompt
    severity: major
    condition: "Every image prompt preserves creator and product identity anchors."
    route: image_prompt

  - code: VIDEO_PROMPT_HAS_FRAME_A_B
    stage: video_prompt
    severity: blocking
    condition: "Every video scene defines Frame A, Frame B, and connecting motion."
    route: video_prompt

  - code: REALISM_NO_MANNEQUIN_BEHAVIOR
    stage: realism
    severity: major
    condition: "Human movement includes plausible weight, gaze, hand behavior, and micro-adjustments."
    route: human_realism

  - code: REALISM_CAMERA_PLAUSIBLE
    stage: realism
    severity: major
    condition: "Camera behavior matches the declared capture format and smartphone relationship."
    route: human_realism

  - code: PRODUCT_IDENTITY_STABLE
    stage: product_consistency
    severity: blocking
    condition: "Product identity does not drift without physical explanation."
    route: product_consistency

  - code: PRODUCT_STATE_CONTINUOUS
    stage: product_consistency
    severity: major
    condition: "Product state changes are physically explained by preceding action."
    route: product_consistency

  - code: CREATOR_CONTINUITY_STABLE
    stage: product_consistency
    severity: major
    condition: "Creator identity and clothing state remain consistent across scenes."
    route: product_consistency

  - code: MIRROR_GEOMETRY_VALID
    stage: realism
    severity: blocking
    condition: "Mirror selfie scenes preserve reflection geometry and plausible phone placement."
    route: human_realism

  - code: CTA_COMPATIBLE
    stage: strategy
    severity: major
    condition: "CTA is present when required and does not contradict format or duration."
    route: strategy

  - code: CLAIMS_SUPPORTED
    stage: product_consistency
    severity: blocking
    condition: "Product claims are grounded in verified product information."
    route: product_consistency

  - code: PROMPT_NOT_BLOATED
    stage: image_prompt
    severity: minor
    condition: "Prompt specificity improves controllability without redundant or contradictory instructions."
    route: image_prompt

  - code: CROSS_ENGINE_CONSISTENCY
    stage: runtime
    severity: blocking
    condition: "Final output remains consistent across all upstream and downstream engines."
    route: orchestrator