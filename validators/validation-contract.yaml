$schema: "https://json-schema.org/draft/2020-12/schema"
title: Validation Result
type: object
additionalProperties: false
required: [status, issues]
properties:
  status:
    type: string
    enum: [pass, pass_with_warnings, revise, block]
  issues:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [code, severity, message, stage]
      properties:
        code: {type: string}
        severity:
          type: string
          enum: [blocking, major, minor]
        message: {type: string}
        stage: {type: string}
        scene_id:
          type: [integer, "null"]
        route:
          type: [string, "null"]
  summary:
    type: object
    additionalProperties: false
    properties:
      blocking: {type: integer, minimum: 0}
      major: {type: integer, minimum: 0}
      minor: {type: integer, minimum: 0}