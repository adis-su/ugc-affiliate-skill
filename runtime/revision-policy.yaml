version: "1.0"
max_revision_cycles: 3

priority:
  1: blocking
  2: major
  3: minor

routing:
  input: [normalize, validate_input]
  strategy: [strategy]
  format: [format]
  concept: [concept]
  script_behavior: [script_behavior]
  storyboard: [storyboard]
  image_prompt: [image_prompt]
  video_prompt: [video_prompt]
  human_realism: [realism]
  product_consistency: [product_consistency]
  orchestrator: [qc]

rules:
  - "Fix the earliest responsible stage."
  - "Regenerate only affected scenes when safe."
  - "After revision, re-run all dependent downstream stages."
  - "Never suppress a blocking issue to reach package status."
  - "If max revision cycles are exceeded, return revise with unresolved issues.";
