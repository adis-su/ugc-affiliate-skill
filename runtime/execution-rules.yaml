version: "1.0"
rules:
  precedence:
    - explicit_user_input
    - explicit_creator_or_product_reference
    - verified_product_information
    - engine_rules
    - safe_defaults

  execution:
    - "Run stages in dependency order."
    - "Do not skip a required upstream stage."
    - "Do not let downstream prompts redefine strategy or concept."
    - "Preserve continuity anchors across all scenes."
    - "Use deterministic validation after creative stages."
    - "Cache unchanged upstream outputs during scene-level revision."

  creative:
    - "Prefer one coherent concept over multiple competing ideas."
    - "Prefer believable human UGC over cinematic polish."
    - "Do not invent unsupported product claims."
    - "Do not add visual complexity without a content reason."

  output:
    - "Every final scene must map to one storyboard scene."
    - "Every video prompt must describe Frame A, Frame B, and connecting motion."
    - "Every final package must include QC status."
