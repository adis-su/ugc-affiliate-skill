"$schema": "https://json-schema.org/draft/2020-12/schema"
title: Creative Concept
type: object
additionalProperties: false
required: [title, core_idea, hook, creator_motivation, product_role, behavioral_premise, visual_progression, emotional_tone, authenticity_strategy, format_fit, angle_fit, must_show, must_avoid]
properties:
  title: {type: string}
  core_idea: {type: string}
  hook: {type: string}
  creator_motivation: {type: string}
  product_role: {type: string}
  behavioral_premise: {type: string}
  visual_progression: {type: array, minItems: 1, items: {type: string}}
  emotional_tone: {type: string}
  authenticity_strategy: {type: array, items: {type: string}}
  format_fit: {type: string}
  angle_fit: {type: string}
  must_show: {type: array, items: {type: string}}
  must_avoid: {type: array, items: {type: string}}
