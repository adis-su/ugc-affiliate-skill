"$schema": "https://json-schema.org/draft/2020-12/schema"
title: Storyboard
type: object
additionalProperties: false
required: [total_duration, format, platform, scenes, ending]
properties:
  total_duration: {type: number, exclusiveMinimum: 0}
  format: {type: string}
  platform: {type: array, minItems: 1, items: {type: string}}
  scenes:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [scene_id, start, end, purpose, behavior, visual_state, camera, composition, transition, image_reference, video]
      properties:
        scene_id: {type: integer, minimum: 1}
        start: {type: number, minimum: 0}
        end: {type: number, exclusiveMinimum: 0}
        purpose: {type: string}
        behavior: {type: string}
        dialogue: {type: [string, "null"]}
        visual_state:
          type: object
          additionalProperties: false
          required: [creator, product, environment, background, lighting]
          properties:
            creator: {type: string}
            product: {type: string}
            environment: {type: string}
            background: {type: string}
            lighting: {type: string}
        camera:
          type: object
          additionalProperties: false
          required: [relationship, framing, angle, movement, stability]
          properties:
            relationship: {type: string}
            framing: {type: string}
            angle: {type: string}
            movement: {type: string}
            stability: {type: string}
        composition:
          type: object
          additionalProperties: false
          required: [subject_position, product_emphasis, negative_space]
          properties:
            subject_position: {type: string}
            product_emphasis: {type: string}
            negative_space: {type: string}
        transition:
          type: object
          additionalProperties: false
          required: [type, from_state, to_state]
          properties:
            type: {type: string}
            from_state: {type: string}
            to_state: {type: string}
        image_reference:
          type: object
          additionalProperties: false
          required: [required, continuity_anchor]
          properties:
            required: {type: boolean}
            continuity_anchor: {type: string}
        video:
          type: object
          additionalProperties: false
          required: [frame_a, frame_b, motion]
          properties:
            frame_a: {type: string}
            frame_b: {type: string}
            motion: {type: string}
  ending:
    type: object
    additionalProperties: false
    required: [cta, visual_payoff, final_state]
    properties:
      cta: {type: string}
      visual_payoff: {type: string}
      final_state: {type: string}
