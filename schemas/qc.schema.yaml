"$schema": "https://json-schema.org/draft/2020-12/schema"
title: Quality Control
type: object
additionalProperties: false
required: [status, blocking_issues, warnings, corrections]
properties:
  status:
    type: string
    enum: [pass, pass_with_warnings, revise, block]
  blocking_issues: {type: array, items: {type: string}}
  warnings: {type: array, items: {type: string}}
  corrections:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [issue, route]
      properties:
        issue: {type: string}
        route: {type: string}
        scene_id: {type: [integer, "null"]}
