"$schema": "https://json-schema.org/draft/2020-12/schema"
title: Fashion UGC Runtime State
type: object
additionalProperties: false
required: [schema_version, request, state, execution]
properties:
  schema_version: {type: string}
  request: {type: object}
  state:
    type: object
    additionalProperties: true
  execution:
    type: object
    additionalProperties: false
    required: [current_stage, completed_stages, revision_count, revision_history]
    properties:
      current_stage: {type: string}
      completed_stages: {type: array, items: {type: string}}
      revision_count: {type: integer, minimum: 0}
      revision_history: {type: array, items: {type: object}}
