"$schema": "https://json-schema.org/draft/2020-12/schema"
title: Script Behavior
type: object
additionalProperties: false
required: [total_duration, mode, beats]
properties:
  total_duration: {type: number, exclusiveMinimum: 0}
  mode: {type: string, enum: [dialogue, behavior, narration_behavior, dialogue_behavior]}
  beats:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [beat_id, start, end, purpose, behavior, product_state]
      properties:
        beat_id: {type: integer, minimum: 1}
        start: {type: number, minimum: 0}
        end: {type: number, exclusiveMinimum: 0}
        purpose: {type: string}
        dialogue: {type: [string, "null"]}
        behavior: {type: string}
        product_state: {type: string}
        camera_state: {type: [string, "null"]}
        transition: {type: [string, "null"]}
